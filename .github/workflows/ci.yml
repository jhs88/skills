# Static commands only; PR content is checked out but never interpolated into shell commands.
name: Validate shared skills
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream
        with:
          persist-credentials: false
      - name: Test updater safety and reconciliation
        run: python3 -m unittest discover -s tests -v
      - name: Validate copied skills and provenance offline
        run: python3 scripts/sync_mattpocock.py --check
